name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Find project
        run: |
          ZIP=$(for f in *.zip; do [ -e "$f" ] && echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -rn | head -n 1 | cut -d' ' -f2-)
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            mkdir extracted
            unzip -q "$ZIP" -d extracted
            SEARCH=extracted
          else
            SEARCH=.
          fi
          SET=$(find "$SEARCH" -name settings.gradle.kts | head -n 1)
          if [ -z "$SET" ]; then
            echo "No settings.gradle.kts found"
            find . -maxdepth 4 -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "APP_DIR=$(dirname "$SET")" >> $GITHUB_ENV

      - name: Create debug keystore
        working-directory: ${{ env.APP_DIR }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-APK
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bloom v${{ github.run_number }}
          files: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
