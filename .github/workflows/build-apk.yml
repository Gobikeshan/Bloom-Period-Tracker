name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir extracted
          unzip -q "$(ls *.zip | head -n 1)" -d extracted
          PKG=$(find extracted -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n 1)
          echo "APP_DIR=$(dirname "$PKG")" >> $GITHUB_ENV

      - name: Install and build web app
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm run build -- --base=./

      - name: Add Capacitor and Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Bloom com.bloom.app --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
